<svg xmlns="http://www.w3.org/2000/svg" width="480" height="444" viewBox="0 0 480 444" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">SelfWorkFlow 的按需执行路径</title>
  <desc id="overview-desc">自上而下读取入口并绑定版本，选择任务深度与所需模块，完成必要审查验证，再交付或沿授权写入知识。Light 使用窄自审，Full 和 Deep 按规则使用独立审查；知识写入是可选操作。</desc>
  <defs>
    <marker id="overview-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#586a82"/></marker>
  </defs>
  <rect width="480" height="444" rx="14" fill="#f5f8fc"/>
  <g fill="#fff" stroke="#8ea6c5" stroke-width="1.5">
    <rect x="18" y="16" width="444" height="86" rx="12"/>
    <rect x="18" y="124" width="444" height="86" rx="12"/>
    <rect x="18" y="232" width="444" height="86" rx="12"/>
    <rect x="18" y="340" width="444" height="86" rx="12"/>
  </g>
  <g stroke="#586a82" stroke-width="2" marker-end="url(#overview-arrow)">
    <path d="M240 103 V119"/><path d="M240 211 V227"/><path d="M240 319 V335"/>
  </g>
  <g text-anchor="middle" fill="#172b46" font-family="'Times New Roman', FangSong, '仿宋', serif">
    <text id="overview-entry" x="240" y="48" font-size="25">入口与版本绑定</text>
    <text x="240" y="80" font-size="20">读取 SKILL.md，继承 revision/documentRoot</text>
    <text x="240" y="156" font-size="25">选择深度，按需加载</text>
    <text id="overview-conditions" x="240" y="188" font-size="20">Light / Full / Deep；仅加载命中模块</text>
    <text x="240" y="264" font-size="25">审查与验证</text>
    <text x="240" y="296" font-size="20">复用证据，核对行为与未完成项</text>
    <text x="240" y="372" font-size="25">交付与可选知识写入</text>
    <text x="240" y="404" font-size="20">知识写入沿既有授权与后端协议</text>
  </g>
</svg>
