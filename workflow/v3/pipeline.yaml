schemaVersion: 3
stages:
  - id: discovered
    slots:
      - id: discover.context
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
  - id: capability-checked
    slots:
      - id: capability.check
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
  - id: classified
    slots:
      - id: classify.task
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
  - id: designed
    slots:
      - id: design.precheck
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
      - id: code.reasoning
        cardinality: zero-or-many
        allowedInvocationKinds: [skill]
        selectionMode: bounded-runtime
  - id: planned
    slots:
      - id: plan.primary
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
      - id: test.quality.plan
        cardinality: zero-or-one
        allowedInvocationKinds: [skill]
        selectionMode: bounded-runtime
        condition: {gte: [testLevelFloor, T2]}
  - id: implemented
    slots:
      - id: implement.method
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
      - id: test.quality.implementation
        cardinality: zero-or-one
        allowedInvocationKinds: [skill]
        selectionMode: bounded-runtime
        condition: {gte: [testLevelFloor, T2]}
  - id: reviewed
    slots:
      - id: review.self
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
      - id: test.quality.review
        cardinality: zero-or-one
        allowedInvocationKinds: [skill]
        selectionMode: bounded-runtime
        condition: {gte: [testLevelFloor, T2]}
  - id: verified
    slots:
      - id: verify.execution
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
      - id: test.quality.verify
        cardinality: zero-or-many
        allowedInvocationKinds: [skill]
        selectionMode: bounded-runtime
        condition: {gte: [testLevelFloor, T3]}
      - id: code.verify
        cardinality: zero-or-one
        allowedInvocationKinds: [agent-native, skill, mcp]
        selectionMode: bounded-runtime
  - id: completed
    slots:
      - id: complete.gate
        cardinality: exactly-one
        allowedInvocationKinds: [agent-native]
        selectionMode: static
