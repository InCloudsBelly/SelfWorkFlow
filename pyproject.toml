[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selfworkflow"
version = "0.1.0.dev0"
description = "Windows-only cross-vendor agent workflow tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[project.scripts]
selfworkflow = "selfworkflow.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
